apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: speaker
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  strategy:
    type: Recreate
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 10
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 512Mi
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  accessPolicy:
    outbound:
      external:
        - host: api.sanity.io
        - host: z9kr8ddn.api.sanity.io
        - host: apicdn.sanity.io
        - host: z9kr8ddn.apicdn.sanity.io
        - host: cdn.sanity.io
      rules:
        - application: logging
          namespace: nais-system
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: SANITY_PROJECT_ID
      value: z9kr8ddn
    - name: SANITY_DATASET
      value: production
  envFrom:
    - secret: sanity-read-datasets-token-speaker
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
